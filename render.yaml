services:
  - type: web
    name: pochamatch-backend
    runtime: python
    rootDir: pochamatch-backend
    buildCommand: pip install poetry && poetry install
    startCommand: poetry run uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
